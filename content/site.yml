# ===== 수나래 수학학원 홈페이지 내용 =====
# 홈페이지에 보이는 글은 모두 이 파일에서 고칩니다.
# GitHub에서 이 파일을 열고 연필 아이콘(Edit) → 고치기 → Commit changes. 1~2분 뒤 반영됩니다.
#
# 고칠 때 지킬 것
# - "항목 이름:" 은 그대로 두고, 그 뒤의 글만 바꿉니다.
# - 줄 앞의 띄어쓰기(들여쓰기)는 그대로 둡니다.
# - [대괄호]로 시작하는 글이나 : # 가 들어간 글은 "큰따옴표" 안에 씁니다.
# - 여러 줄 글( | 표시가 있는 항목)은 빈 줄로 문단을 나눕니다.

name: 수나래 수학학원
short_name: 수나래 수학
mark: images/mark.png
main_photo: ""          # PC 첫 화면 사진. 예: images/main.jpg (비워두면 회색 칸)

# ----- 홈 -----
intro: "[학원 소개 문구가 들어갈 자리입니다.]"

# ----- 원장 소개 -----
director:
  name: "[원장 이름]"
  title: 원장
  photo: ""             # 예: images/director.jpg (비워두면 회색 칸)
  career:               # 약력. 줄을 늘리거나 줄여도 됩니다.
    - "[약력 1]"
    - "[약력 2]"
    - "[약력 3]"
  philosophy: |
    [교육 철학이나 인사말이 들어갈 자리입니다.]

# ----- 수업 안내 -----
# 반을 추가하려면 "- name:" 부터 한 덩어리를 복사해서 붙이세요.
classes:
  - name: 초등부
    summary: "[한 줄 설명]"
    details:
      - "[대상]"
      - "[수업 내용]"
      - "[수업 시간]"
  - name: 중등부
    summary: "[한 줄 설명]"
    details:
      - "[대상]"
      - "[수업 내용]"
      - "[수업 시간]"
  - name: 고등부
    summary: "[한 줄 설명]"
    details:
      - "[대상]"
      - "[수업 내용]"
      - "[수업 시간]"

# ----- 오시는 길 -----
location:
  address: "[도로명 주소]"
  detail: "[건물 이름, 층수]"
  phone: 0507-1322-1732   # 누르면 전화가 걸립니다
  hours: "[운영 시간]"
  map: ""                 # 약도 이미지. 예: images/map.png (비워두면 회색 칸)
  # 지도 버튼: 비워두면 위 주소로 검색한 지도가 열립니다.
  # 지도 앱에서 "공유 > 링크 복사"한 주소를 넣으면 그 장소가 바로 열립니다.
  naver_map: ""
