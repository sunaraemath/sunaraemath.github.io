<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-title" content="수나래 시간표">
  <title>수나래 시간표(학생용)</title>
  <style>
    :root {
      --bg: #f6f6f4; --card: #fff; --line: #e6e5e0; --line2: #cfcdc6;
      --tx: #1f1f1d; --tx2: #6b6a65; --tx3: #9b9a94;
      --acc: #185fa5; --red: #a32d2d; --red-bg: #fcebeb; --warn-bg: #faeeda;
      --r: 8px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--tx); font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; }
    button, input, select { font: inherit; color: inherit; }
    button { background: var(--card); border: 1px solid var(--line2); border-radius: var(--r); padding: 4px 11px; cursor: pointer; }
    button:disabled { color: var(--line2); cursor: default; }
    button.pri { background: var(--tx); color: #fff; border-color: var(--tx); padding: 9px 12px; width: 100%; }
    input, select { border: 1px solid var(--line2); border-radius: var(--r); padding: 7px 10px; background: #fff; }
    main { max-width: 560px; margin: 0 auto; padding: 12px 10px calc(32px + env(safe-area-inset-bottom)); }
    h1 { font-size: 20px; font-weight: 700; margin: 0 0 14px; }
    .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 16px; margin-top: 48px; }
    .box input, .box select { width: 100%; margin-bottom: 10px; }
    .msg { color: var(--tx2); }
    .err { color: var(--red); font-size: 14px; min-height: 21px; margin-top: 6px; }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .head select { min-width: 0; flex: 0 1 130px; font-weight: 600; }
    .cls { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .cls .on { background: #efeee9; border-color: var(--tx2); font-weight: 600; }
    .nav { display: flex; align-items: center; gap: 6px; flex: none; }
    .nav b { white-space: nowrap; }
    .sum { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-bottom: 10px; font-size: 15px; }
    .mu { color: var(--tx2); }
    .bk { color: var(--acc); }
    .short { color: var(--red); }
    .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; font-size: 12px; line-height: 1.3; }
    .cal > div { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 3px; min-height: 58px; overflow-wrap: anywhere; }
    .cal .h { background: none; border: none; min-height: 0; text-align: center; color: var(--tx2); font-size: 14px; }
    .cal .sun { color: var(--red); }
    .cal .blank { background: none; border: none; }
    .cal .none { color: var(--tx3); }
    .cal .off { background: var(--red-bg); color: var(--red); }
    .cal .sp { background: var(--warn-bg); }
    .cal .today { border: 2px solid var(--acc); padding: 1px 2px; }
    .cal .dn { display: block; width: fit-content; font-weight: 600; font-size: 13px; }
    .cal .today .dn { background: var(--tx); color: #fff; border-radius: 4px; padding: 0 3px; }
    .cal .rpd { opacity: .45; }
    .cal .cv { color: var(--tx3); font-size: 11px; }
    .hw { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-top: 10px; }
    .hw h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
    .hw div { padding: 5px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
    .legend { color: var(--tx2); font-size: 13px; margin-top: 10px; }
    @media (min-width: 480px) { .cal { font-size: 14px; gap: 5px; } .cal > div { padding: 3px 6px; min-height: 72px; } }
  </style>
</head>
<body>
  <main id="app"><div class="box msg">불러오는 중…</div></main>
  <script>
    // Apps Script 배포 주소 (학생용 프로젝트의 웹 앱 URL)
    const API_URL = 'https://script.google.com/macros/s/AKfycbxI9TRLCPsv1BFKRfJxl2ZPFVk7Cs3zKe-_PI5H7u91h72-4ZpbogA6jO10JxN-8vy6Fw/exec';

    const DOW = ['일', '월', '화', '수', '목', '금', '토'];
    const S = { pw: '', data: null, sid: '', cls: '', ym: '', err: '', busy: false, tried: false, at: 0 };
    const app = document.getElementById('app');

    // 기억해 두기: 사생활 보호 모드 등에서 저장이 막혀도 화면은 그대로 동작합니다
    const store = {
      get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
      set(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} },
    };

    const pad = n => (n < 10 ? '0' : '') + n;
    const parts = s => s.split('-').map(Number);
    const r1 = x => Math.round(x * 10) / 10;
    const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
    const hrs = s => (toMin(s.end) - toMin(s.start)) / 60;
    function f12(t) { const [h, m] = t.split(':').map(Number); if (h < 12) return '오전 ' + h + ':' + pad(m); return (h > 12 ? h - 12 : h) + ':' + pad(m); }
    function daysIn(ym) { const [y, m] = parts(ym); return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
    function dowOf(ds) { const [y, m, d] = parts(ds); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); }
    function addMonths(ym, n) { const [y, m] = parts(ym); const t = new Date(Date.UTC(y, m - 1 + n, 1)); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1); }
    const monthNo = ym => Number(ym.slice(5));
    const monthDates = ym => Array.from({ length: daysIn(ym) }, (_, i) => ym + '-' + pad(i + 1));
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    /** 공개된 학생이 있는 반만 (서버가 예전 버전이면 빈 목록) */
    const classes = () => ['원장반', '희진쌤', '혜성쌤'].filter(c => S.data.students.some(s => s.cls === c));
    const holOf = ds => S.data.holidays.find(h => h.date === ds);
    const slotsOf = (sid, ds) => S.data.slots.filter(x => x.sid === sid && x.date === ds).sort((a, b) => toMin(a.start) - toMin(b.start));
    const isCarry = ds => { const h = holOf(ds); return !!h && h.type === '이월'; };

    /** 끝과 시작이 맞닿은 수업을 하나로 합칩니다. 보강이 들어 있으면 bk, 수업 대체는 합치지 않습니다. */
    function mergeRuns(sl) {
      const out = [];
      sl.forEach(x => {
        const last = out[out.length - 1];
        if (last && !x.rp && !last.rp && last.end === x.start) { last.end = x.end; last.bk = last.bk || x.bk; }
        else out.push({ start: x.start, end: x.end, bk: x.bk, rp: x.rp });
      });
      return out;
    }

    /** 그 달 총합으로 세는 기본·보강 시간. 관리 프로그램의 개인 시간표와 같은 규칙입니다. */
    function counted(sid, ym) {
      const r = { base: 0, bk: 0, out: 0, in: 0 };
      const add = (ds, key) => slotsOf(sid, ds).forEach(x => { r[x.bk ? 'bk' : 'base'] += hrs(x); if (key) r[key] += hrs(x); });
      monthDates(ym).forEach(ds => { if (isCarry(ds)) slotsOf(sid, ds).forEach(x => { r.out += hrs(x); }); else add(ds); });
      monthDates(addMonths(ym, -1)).filter(isCarry).forEach(ds => add(ds, 'in'));
      r.total = r.base + r.bk;
      return r;
    }

    async function fetchData(pw) {
      const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ pw: pw }) });
      if (!res.ok) throw new Error('network');
      return res.json();
    }

    async function load(pw, quiet) {
      S.busy = true;
      if (!quiet) { S.err = ''; render(); }
      try {
        const d = await fetchData(pw);
        if (d.ok) {
          S.pw = pw; S.data = d; S.at = Date.now(); S.err = '';
          store.set('sn_pw', pw);
          const saved = S.sid || store.get('sn_sid');
          S.sid = d.students.some(s => s.id === saved) ? saved : '';
          const c = S.cls || store.get('sn_cls');
          S.cls = classes().indexOf(c) >= 0 ? c : '';
          if (d.months.indexOf(S.ym) < 0) S.ym = pickMonth(d);
        } else if (d.denied) {
          S.pw = ''; S.data = null; store.set('sn_pw', '');
          S.err = pw && !quiet && S.tried ? '비밀번호가 맞지 않습니다.' : '';
        } else {
          S.err = d.error || '시간표를 불러오지 못했습니다.';
        }
      } catch (e) {
        if (!quiet || !S.data) S.err = '시간표를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도하세요.';
      }
      S.busy = false;
      render();
    }

    /** 처음 보여 줄 달: 이번 달, 없으면 이번 달에 가장 가까운 앞선 달, 그것도 없으면 첫 달 */
    function pickMonth(d) {
      const cur = d.today.slice(0, 7), past = d.months.filter(m => m <= cur);
      return past.length ? past[past.length - 1] : (d.months[0] || '');
    }

    function render() {
      if (S.data) { app.innerHTML = viewTable(); return; }
      if (S.busy && !S.tried) { app.innerHTML = '<div class="box msg">불러오는 중…</div>'; return; }
      const failed = S.err && S.err.indexOf('비밀번호') < 0;
      app.innerHTML = '<div class="box"><h1>수나래 시간표(학생용)</h1><form id="login">' +
        '<input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호">' +
        '<button class="pri" type="submit"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '확인 중…' : failed ? '다시 시도' : '시간표 보기') + '</button></form>' +
        '<div class="err" role="alert">' + esc(S.err) + '</div></div>';
    }

    function viewTable() {
      const d = S.data, list = d.students.slice().sort((a, b) => a.name.localeCompare(b.name, 'ko')), cl = classes();
      const shown = list.filter(s => !S.cls || s.cls === S.cls), cur = list.find(s => s.id === S.sid), inList = shown.some(s => s.id === S.sid);
      const bar = cl.length ? '<div class="cls">' + cl.concat('').map(c => '<button data-c="' + c + '"' + (c === S.cls ? ' class="on"' : '') + '>' + (c || '전체') + '</button>').join('') + '</div>' : '';
      const names = (S.sid && !inList ? '<option value="" selected>이름 선택</option>' : '') + shown.map(s => '<option value="' + esc(s.id) + '"' + (s.id === S.sid ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('');
      if (!list.length) return '<div class="box msg">아직 공개된 시간표가 없습니다.</div>';
      if (!S.sid) {
        return '<div class="box"><h1>수나래 시간표(학생용)</h1>' + bar + '<select id="stu" aria-label="이름 선택"><option value="">이름을 선택하세요</option>' + names + '</select></div>';
      }
      if (!S.ym) {
        return bar + '<div class="head"><select id="stu" aria-label="이름 선택">' + names + '</select></div><div class="box msg" style="margin-top:12px">아직 올라온 시간표가 없습니다.</div>';
      }
      const ym = S.ym, i = d.months.indexOf(ym), c = counted(S.sid, ym), std = ((d.stdOf || {})[S.sid] || {})[ym] || d.standards[ym], [y, m] = parts(ym);
      let h = bar + '<div class="head"><select id="stu" aria-label="이름 선택">' + names + '</select><div class="nav">' +
        '<button data-m="-1" aria-label="이전 달"' + (i <= 0 ? ' disabled' : '') + '>‹</button><b>' + y + '년 ' + m + '월</b>' +
        '<button data-m="1" aria-label="다음 달"' + (i >= d.months.length - 1 ? ' disabled' : '') + '>›</button></div></div>';
      if (!inList && cur) h += '<div class="mu" style="margin-bottom:4px">지금 보는 시간표: <b>' + esc(cur.name) + '</b></div>';
      h += '<div class="sum"><span' + (c.base < std ? ' class="short"' : '') + '>기본 <b>' + r1(c.base) + '</b> <span class="mu">/ ' + std + '</span></span><span class="bk">보강 <b>' + r1(c.bk) + '</b></span><span>총 <b>' + r1(c.total) + '시간</b></span>' +
        (c.in ? '<span class="mu">' + monthNo(addMonths(ym, -1)) + '월에서 이월 ' + r1(c.in) + '시간 포함</span>' : '') +
        (c.out ? '<span class="mu">' + monthNo(addMonths(ym, 1)) + '월로 이월 ' + r1(c.out) + '시간</span>' : '') + '</div>';
      h += '<div class="cal">' + DOW.map((x, k) => '<div class="h' + (k ? '' : ' sun') + '">' + x + '</div>').join('');
      // 지난달에서 이월된 날은 이번 달 달력 앞에도 보여 줍니다
      const prev = monthDates(addMonths(ym, -1)), carryIn = prev.filter(ds => isCarry(ds) && slotsOf(S.sid, ds).length);
      const start = carryIn.length ? carryIn[0] : ym + '-01';
      for (let k = 0; k < dowOf(start); k++) h += '<div class="blank"></div>';
      prev.filter(ds => ds >= start).concat(monthDates(ym)).forEach(ds => {
        const inC = ds.slice(0, 7) !== ym;
        if (inC && carryIn.indexOf(ds) < 0) { h += '<div class="blank"></div>'; return; }
        const sl = slotsOf(S.sid, ds), hh = holOf(ds), off = (hh && hh.type === '휴강') || (!sl.length && (d.offs || []).some(x => x.sid === S.sid && x.date === ds));
        let body = off ? (hh && hh.type === '휴강' && esc(hh.reason)) || '휴강' : sl.length ? mergeRuns(sl).map(x => '<div' + (x.rp ? ' class="rpd"' : x.bk ? ' class="bk"' : '') + '>' + f12(x.start) + '<wbr>~' + f12(x.end) + '</div>').join('') : '-';
        if (hh && hh.type === '이월') body += '<div class="cv">' + (inC ? monthNo(addMonths(ym, -1)) + '월에서' : '→' + monthNo(addMonths(ym, 1)) + '월') + '</div>';
        const cls = [off ? 'off' : '', hh && hh.type === '특별' ? 'sp' : '', !sl.length && !off ? 'none' : '', ds === d.today ? 'today' : ''].join(' ');
        h += '<div class="' + cls + '"><span class="dn">' + (inC ? monthNo(ds.slice(0, 7)) + '/' + Number(ds.slice(8)) : Number(ds.slice(8))) + '</span>' + body + '</div>';
      });
      const hw = d.hw.filter(x => x.sid === S.sid).sort((a, b) => (a.date < b.date ? -1 : 1));
      h += '</div><section class="hw"><h2>남은 숙제</h2>' + (hw.length ? hw.map(x => '<div>남은 <b>' + esc(x.remain) + '</b>문제' + (x.reason ? ' <span class="mu">· ' + esc(x.reason) + '</span>' : '') + '</div>').join('') : '<div class="mu">남은 숙제가 없습니다.</div>') + '</section>';
      return h + '<div class="legend"><span class="bk">파랑 = 보강</span> · 빨강 = 휴강 · 노랑 = 특별 수업 · <span class="rpd">흐린 시간 = 수업 대체</span> · →다음 달 = 그날 시간은 다음 달 총합으로</div>';
    }

    app.addEventListener('submit', e => {
      e.preventDefault();
      // 연결 실패 뒤 다시 시도할 때는 기억해 둔 비밀번호를 그대로 씁니다
      const pw = document.getElementById('pw').value.trim() || store.get('sn_pw');
      if (!pw) { S.err = '비밀번호를 입력하세요.'; render(); return; }
      S.tried = true;
      load(pw);
    });
    app.addEventListener('change', e => {
      if (e.target.id !== 'stu') return;
      if (!e.target.value) return;
      S.sid = e.target.value;
      store.set('sn_sid', S.sid);
      render();
    });
    app.addEventListener('click', e => {
      const c = e.target.closest('[data-c]');
      if (c) { S.cls = c.dataset.c; store.set('sn_cls', S.cls); render(); return; }
      const b = e.target.closest('[data-m]');
      if (!b || b.disabled) return;
      S.ym = S.data.months[S.data.months.indexOf(S.ym) + Number(b.dataset.m)];
      render();
    });
    // 오래 켜 둔 화면으로 돌아오면 최신 시간표로 바꿉니다
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && S.data && !S.busy && Date.now() - S.at > 300000) load(S.pw, true);
    });

    (function init() {
      const pw = store.get('sn_pw');
      if (pw) { load(pw); } else render();
    })();
  </script>
</body>
</html>
